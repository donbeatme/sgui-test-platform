services:
  postgres:
    image: ${DOCKER_POSTGRES_IMAGE:-postgres:16-alpine}
    container_name: guicase-next-postgres
    command: postgres -c max_connections=100 -c shared_buffers=128MB
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-wharttest}
    volumes: [postgres-data:/var/lib/postgresql/data]
    mem_limit: 512m
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      retries: 10
  redis:
    image: ${DOCKER_REDIS_IMAGE:-redis:7-alpine}
    container_name: guicase-next-redis
    command: redis-server --appendonly yes
    volumes: [redis-data:/data]
    mem_limit: 128m
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      retries: 10
  qdrant:
    image: ${DOCKER_QDRANT_IMAGE:-qdrant/qdrant:latest}
    container_name: guicase-next-qdrant
    volumes: [qdrant-data:/qdrant/storage]
    mem_limit: 512m
    restart: unless-stopped
  backend:
    image: ${DOCKER_BACKEND_IMAGE}
    container_name: guicase-next-backend
    entrypoint: ['/bin/bash', '/app/local-entrypoint.sh']
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: workbench_settings
      DATABASE_TYPE: postgres
      POSTGRES_HOST: postgres
      DJANGO_DEBUG: 'False'
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,backend,frontend,host.docker.internal,testserver
      DJANGO_CORS_ALLOWED_ORIGINS: http://127.0.0.1:8778,http://localhost:8778
      DJANGO_CSRF_TRUSTED_ORIGINS: http://127.0.0.1:8778,http://localhost:8778,http://127.0.0.1:8779
      MEDIA_ROOT: /app/data/media
      LANGGRAPH_CHECKPOINT_SQLITE_PATH: /app/data/chat_history.sqlite
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
      DJANGO_BASE_URL: http://localhost:8000
      HF_HOME: /app/data/cache/huggingface
      NLTK_DATA: /app/data/cache/nltk_data
    ports: ['127.0.0.1:8779:8000']
    volumes:
      - ../Django:/app
      - ../data:/app/data
      - backend-static:/app/static
      - ../Skills:/app/bundled_skills:ro
      - ./entrypoint.sh:/app/local-entrypoint.sh:ro
      - ./bootstrap.py:/app/workbench_bootstrap.py:ro
      - ./supervisord.conf:/app/supervisord.conf:ro
    mem_limit: 2304m
    restart: unless-stopped
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      qdrant: {condition: service_started}
    healthcheck:
      test: ['CMD', 'python', '-c', "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/admin/login/')"]
      interval: 15s
      start_period: 120s
      retries: 10
  frontend:
    image: ${DOCKER_FRONTEND_IMAGE}
    container_name: guicase-next-frontend
    ports: ['127.0.0.1:8778:80']
    volumes:
      - ../Vue/dist:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ../data/media:/srv/media:ro
      - backend-static:/srv/static:ro
    mem_limit: 128m
    restart: unless-stopped
    depends_on:
      backend: {condition: service_healthy}
    healthcheck:
      test: ['CMD', 'wget', '--quiet', '--tries=1', '--spider', 'http://127.0.0.1/']
      interval: 15s
      retries: 10
  mcp:
    image: ${DOCKER_MCP_IMAGE}
    container_name: guicase-next-mcp
    environment:
      WHARTTEST_BACKEND_URL: http://backend:8000
      WHARTTEST_API_KEY: ${WHARTTEST_API_KEY}
      MS_API_HOST: ${MS_API_HOST:-}
      MS_ACCESS_KEY: ${MS_ACCESS_KEY:-}
      MS_SECRET_KEY: ${MS_SECRET_KEY:-}
    volumes:
      - ../data/playwright-screenshots:/tmp/playwright-output
      - ./mcp-supervisord.conf:/etc/supervisor/conf.d/supervisord.conf:ro
      - ./start-ms-mcp.py:/app/start-ms-mcp.py:ro
    mem_limit: 512m
    restart: unless-stopped
    depends_on: [backend]
  playwright-mcp:
    image: ${DOCKER_PLAYWRIGHT_MCP_IMAGE}
    container_name: guicase-next-playwright-mcp
    user: root
    entrypoint: ['node', '/app/cli.js']
    command: ['--no-sandbox', '--host', '0.0.0.0', '--allowed-hosts', '*', '--config', '/app/playwright-mcp-config.json']
    volumes:
      - ../data/playwright-screenshots:/tmp/playwright-output
      - ../MCP/playwright-mcp-config.json:/app/playwright-mcp-config.json:ro
    mem_limit: 768m
    shm_size: 256m
    restart: unless-stopped
volumes:
  postgres-data:
    external: true
    name: guicase-next_postgres-data
  redis-data:
  qdrant-data:
    external: true
    name: guicase-next_qdrant-data
  backend-static:
