[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
loglevel=info

[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[program:ms_mcp_api]
command=python /app/start-ms-mcp.py
directory=/app
autostart=true
; Optional external integration: a configuration failure must not become a loop.
autorestart=false
exitcodes=0
startsecs=0
startretries=0
stderr_logfile=/var/log/supervisor/ms_mcp_api.err.log
stdout_logfile=/var/log/supervisor/ms_mcp_api.out.log
user=root
environment=PYTHONUNBUFFERED=1

[program:wharttest_tools]
command=python WHartTest_tools.py
directory=/app
autostart=true
autorestart=true
startsecs=10
startretries=3
stderr_logfile=/var/log/supervisor/wharttest_tools.err.log
stdout_logfile=/var/log/supervisor/wharttest_tools.out.log
user=root
environment=PYTHONUNBUFFERED=1
