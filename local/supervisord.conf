[supervisord]
nodaemon=true
logfile=/var/log/supervisord.log
pidfile=/var/run/supervisord.pid

[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[program:django]
command=uvicorn wharttest_django.asgi:application --host 0.0.0.0 --port 8000
directory=/app
autostart=true
autorestart=true
stderr_logfile=/var/log/django_err.log
stdout_logfile=/var/log/django_out.log

[program:celery_worker]
command=celery -A wharttest_django worker -l info --autoscale=1,0 -Q celery,task_center
environment=CELERY_SKIP_CHECKS="1"
directory=/app
autostart=true
autorestart=true
stderr_logfile=/var/log/worker_err.log
stdout_logfile=/var/log/worker_out.log
stopwaitsecs=1900

[program:celery_beat]
command=celery -A wharttest_django beat -l info --schedule=/app/data/celerybeat-schedule
environment=CELERY_SKIP_CHECKS="1"
directory=/app
autostart=true
autorestart=true
stderr_logfile=/var/log/beat_err.log
stdout_logfile=/var/log/beat_out.log
